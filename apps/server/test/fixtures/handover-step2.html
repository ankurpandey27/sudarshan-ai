<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply - Step 2 of 2</title></head>
<body>
<h1>Apply: a few questions</h1>
<form action="handover-thanks.html" method="get">
  <label>What is your notice period in days? <input name="notice" required></label>
  <fieldset>
    <legend>Are you willing to relocate to Pune?</legend>
    <label><input type="radio" name="relocate" value="Yes"> Yes</label>
    <label><input type="radio" name="relocate" value="No"> No</label>
  </fieldset>
  <label>Enter the OTP sent to your phone <input name="otp" required></label>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
