<!doctype html>
<html><head><meta charset="utf-8"><title>Job page with ads</title></head>
<body>
<!-- Himalayas (2026-10-03): "APPLY NOW" banners for loans and other job sites next to the real Apply button. Google's
     ads come in frames; these are ads drawn into the page itself, which some sites do. -->
<ins class="adsbygoogle" data-ad-client="ca-pub-1"><a href="https://loans.example/apply">APPLY NOW &raquo;</a></ins>
<div id="div-gpt-ad-123"><button type="button" onclick="window.__pressed='ad-gpt'">Apply now</button></div>
<div aria-label="Advertisement"><a href="https://jobsabroad.example">Apply Now</a></div>
<a href="https://googleads.g.doubleclick.net/pagead/aclk?x=1">Apply now</a>
<h1>Senior Node.js Developer</h1>
<p>Remote. Node.js, AWS.</p>
<div class="sponsored-job"><a id="real" href="#apply" onclick="window.__pressed='real'">Apply now</a></div>
</body></html>
