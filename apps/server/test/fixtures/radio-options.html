<!doctype html>
<html>
<head><meta charset="utf-8"><title>Radio options</title></head>
<body>
<!-- Yes/No groups whose options have no <label> (CRUXO, Capgemini, 2026-09-30): each option's own words
     come after its button; the question sits above the group. -->
<form>
  <div class="q">
    <p>Are you comfortable working in an onsite setting?</p>
    <div class="opt"><input type="radio" name="onsite" value="Yes"><span>Yes</span></div>
    <div class="opt"><input type="radio" name="onsite" value="No"><span>No</span></div>
  </div>
  <div class="q">
    <div>Will you now, or in the future, require sponsorship for employment visa status?</div>
    <div><div><input type="radio" name="visa" value="yes"> Yes</div></div>
    <div><div><input type="radio" name="visa" value="no"> No</div></div>
  </div>
  <div class="q">
    <p>Do you speak Czech or Slovak?</p>
    <input type="radio" name="czech" value="true">
    <input type="radio" name="czech" value="false">
  </div>
  <div class="q">
    <p>Which languages do you speak?</p>
    <label><input type="checkbox" name="lang" value="en"> English</label>
    <label><input type="checkbox" name="lang" value="hi"> Hindi</label>
  </div>
  <label><input type="checkbox" name="consent"> I agree to the privacy policy</label>
</form>
</body>
</html>
