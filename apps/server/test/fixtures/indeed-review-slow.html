<!doctype html>
<html>
<head><meta charset="utf-8"><title>Review your application - Indeed</title></head>
<body>
<!-- Indeed's review page as seen on 2026-09-29: drawn a few seconds after the address loads, protected
     by invisible reCAPTCHA (no tick box), and confirmed with "Your application was submitted to ...". -->
<header><a href="/">indeed</a></header>
<main id="app"><p>Loading...</p></main>
<script>
  window.__submitted = 0;
  setTimeout(() => {
    document.getElementById('app').innerHTML = `
      <h1>Please review your application</h1>
      <p>By submitting your application, you agree to our Terms, Cookie &amp; Privacy Policies.</p>
      <a href="#preview">Preview what the employer sees</a>
      <button type="button" id="submit">Submit your application</button>
      <p>This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.</p>`;
    document.getElementById('submit').addEventListener('click', () => {
      window.__submitted++;
      setTimeout(() => {
        document.getElementById('app').innerHTML = `
          <h1>Your application was submitted to SAMMAAN Capital Finance</h1>
          <p>You will get an email confirmation.</p>
          <p>Keep track of your applications</p>`;
      }, 800);
    });
  }, 4000);
</script>
</body>
</html>
